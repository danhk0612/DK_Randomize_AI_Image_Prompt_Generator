name: Release

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/DKRandomizeAIImagePromptGenerator.Wpf/DKRandomizeAIImagePromptGenerator.Wpf.csproj"
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($projectVersion)) {
            throw "WPF project Version is not set."
          }

          $tag = "v$projectVersion"
          $expectedBranch = "release/$tag"

          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -ne $expectedBranch) {
            throw "Release branch '${{ github.ref_name }}' does not match project version '$projectVersion'. Expected '$expectedBranch'."
          }

          "version=$projectVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $projectVersion"
          Write-Host "Release tag: $tag"

      - name: Ensure release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release '$tag' already exists."
          }
          $global:LASTEXITCODE = 0

      - name: Restore
        run: dotnet restore DK_Randomize_AI_Image_Prompt_Generator.sln -p:Platform=x64

      - name: Build
        run: dotnet build DK_Randomize_AI_Image_Prompt_Generator.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/DKRandomizeAIImagePromptGenerator.Tests/DKRandomizeAIImagePromptGenerator.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore

      - name: Publish framework-dependent single-file WPF app
        run: dotnet publish src/DKRandomizeAIImagePromptGenerator.Wpf/DKRandomizeAIImagePromptGenerator.Wpf.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained false --no-restore -o artifacts/win-x64

      - name: Build native runtime launcher
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw "Visual C++ build tools were not found."
          }

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          $launcherDir = Join-Path $PWD "src\DKRandomizeAIImagePromptGenerator.Launcher"
          $launcherExe = Join-Path $PWD "artifacts\win-x64\DKRandomizeAIImagePromptGenerator.exe"

          Push-Location $launcherDir
          try {
            $command = '"' + $vcvars + '" >nul && rc /nologo /fo Launcher.res Launcher.rc && cl /nologo /std:c++20 /O2 /EHsc /DUNICODE /D_UNICODE Launcher.cpp Launcher.res /link /SUBSYSTEM:WINDOWS /OUT:"' + $launcherExe + '" user32.lib shell32.lib advapi32.lib'
            & cmd.exe /d /s /c $command
            if ($LASTEXITCODE -ne 0) {
              throw "Native launcher build failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item "Launcher.res" -Force -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: Verify compact package layout
        shell: pwsh
        run: |
          $publishDir = Join-Path $PWD "artifacts\win-x64"
          $expected = @(
            "DKRandomizeAIImagePromptGenerator.exe",
            "DKRandomizeAIImagePromptGenerator.App.exe"
          )
          $files = @(Get-ChildItem -LiteralPath $publishDir -File | Select-Object -ExpandProperty Name | Sort-Object)
          $unexpected = @($files | Where-Object { $_ -notin $expected })
          $missing = @($expected | Where-Object { $_ -notin $files })

          Write-Host "Published files:"
          $files | ForEach-Object { Write-Host " - $_" }

          if ($missing.Count -gt 0 -or $unexpected.Count -gt 0) {
            throw "Compact package layout mismatch. Missing: $($missing -join ', '); Unexpected: $($unexpected -join ', ')"
          }

      - name: Smoke test native launcher runtime detection
        shell: pwsh
        run: |
          $launcher = Join-Path $PWD "artifacts/win-x64/DKRandomizeAIImagePromptGenerator.exe"
          $process = Start-Process -FilePath $launcher -ArgumentList "--runtime-check" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Native launcher did not detect .NET 10 Desktop Runtime. Exit code: $($process.ExitCode)"
          }

      - name: Smoke test WPF mouse wheel routing
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/win-x64/DKRandomizeAIImagePromptGenerator.App.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--scroll-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "WPF mouse wheel routing smoke test failed. Exit code: $($process.ExitCode)"
          }

      - name: Smoke test WPF navigation and keyboard focus
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/win-x64/DKRandomizeAIImagePromptGenerator.App.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "WPF navigation/keyboard UI smoke test failed. Exit code: $($process.ExitCode)"
          }

      - name: Smoke test launcher to published app startup
        shell: pwsh
        run: |
          $appData = Join-Path $env:LOCALAPPDATA "DK Randomize AI Image Prompt Generator"
          $log = Join-Path $appData "startup-crash.log"
          if (Test-Path $log) { Remove-Item $log -Force }

          $launcher = Join-Path $PWD "artifacts/win-x64/DKRandomizeAIImagePromptGenerator.exe"
          $launcherProcess = Start-Process -FilePath $launcher -Wait -PassThru
          if ($launcherProcess.ExitCode -ne 0) {
            throw "Native launcher failed. Exit code: $($launcherProcess.ExitCode)"
          }

          Start-Sleep -Seconds 5

          if (Test-Path $log) {
            Get-Content $log
            throw "Published WPF application reported a startup crash."
          }

          $appProcesses = @(Get-Process -Name "DKRandomizeAIImagePromptGenerator.App" -ErrorAction SilentlyContinue)
          if ($appProcesses.Count -eq 0) {
            throw "Native launcher did not start the published WPF application."
          }

          $appProcesses | Stop-Process -Force

      - name: Create release ZIP
        shell: pwsh
        run: |
          $zip = "artifacts/DK-Randomize-AI-Image-Prompt-Generator-WPF-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "artifacts/win-x64/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $zip = "artifacts/DK-Randomize-AI-Image-Prompt-Generator-WPF-win-x64.zip"

          $args = @(
            "release", "create", $tag, $zip,
            "--repo", "${{ github.repository }}",
            "--target", "${{ github.sha }}",
            "--title", $tag,
            "--generate-notes"
          )

          if ($version.Contains("-")) {
            $args += "--prerelease"
          }

          gh @args

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag --repo "${{ github.repository }}" --json tagName,isPrerelease,assets,url
