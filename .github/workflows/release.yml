name: Release

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/DKRandomizeAIImagePromptGenerator.Wpf/DKRandomizeAIImagePromptGenerator.Wpf.csproj"
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($projectVersion)) {
            throw "WPF project Version is not set."
          }

          $tag = "v$projectVersion"
          $expectedBranch = "release/$tag"

          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -ne $expectedBranch) {
            throw "Release branch '${{ github.ref_name }}' does not match project version '$projectVersion'. Expected '$expectedBranch'."
          }

          "version=$projectVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $projectVersion"
          Write-Host "Release tag: $tag"

      - name: Ensure release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release '$tag' already exists."
          }
          $global:LASTEXITCODE = 0

      - name: Restore
        run: dotnet restore DK_Randomize_AI_Image_Prompt_Generator.sln -p:Platform=x64

      - name: Build
        run: dotnet build DK_Randomize_AI_Image_Prompt_Generator.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/DKRandomizeAIImagePromptGenerator.Tests/DKRandomizeAIImagePromptGenerator.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore

      - name: Publish WPF win-x64
        run: dotnet publish src/DKRandomizeAIImagePromptGenerator.Wpf/DKRandomizeAIImagePromptGenerator.Wpf.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true --no-restore -o artifacts/win-x64

      - name: Smoke test WPF mouse wheel routing
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/win-x64/DKRandomizeAIImagePromptGenerator.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--scroll-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "WPF mouse wheel routing smoke test failed. Exit code: $($process.ExitCode)"
          }

      - name: Smoke test WPF navigation and keyboard focus
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/win-x64/DKRandomizeAIImagePromptGenerator.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "WPF navigation/keyboard UI smoke test failed. Exit code: $($process.ExitCode)"
          }

      - name: Smoke test published app startup
        shell: pwsh
        run: |
          $appData = Join-Path $env:LOCALAPPDATA "DK Randomize AI Image Prompt Generator"
          $log = Join-Path $appData "startup-crash.log"
          if (Test-Path $log) { Remove-Item $log -Force }

          $exe = Join-Path $PWD "artifacts/win-x64/DKRandomizeAIImagePromptGenerator.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5

          if (Test-Path $log) {
            Get-Content $log
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw "Published WPF application reported a startup crash."
          }

          if ($process.HasExited) {
            throw "Published WPF application exited during startup smoke test. Exit code: $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force

      - name: Create release ZIP
        shell: pwsh
        run: |
          $zip = "artifacts/DK-Randomize-AI-Image-Prompt-Generator-WPF-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "artifacts/win-x64/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $zip = "artifacts/DK-Randomize-AI-Image-Prompt-Generator-WPF-win-x64.zip"

          $args = @(
            "release", "create", $tag, $zip,
            "--repo", "${{ github.repository }}",
            "--target", "${{ github.sha }}",
            "--title", $tag,
            "--generate-notes"
          )

          if ($version.Contains("-")) {
            $args += "--prerelease"
          }

          gh @args

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release view $tag --repo "${{ github.repository }}" --json tagName,isPrerelease,assets,url
