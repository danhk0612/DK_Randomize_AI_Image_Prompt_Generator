name: Build

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DK_Randomize_AI_Image_Prompt_Generator.sln -p:Platform=x64

      - name: Build
        run: dotnet build DK_Randomize_AI_Image_Prompt_Generator.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/DKRandomizeAIImagePromptGenerator.Tests/DKRandomizeAIImagePromptGenerator.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore

      - name: Publish WPF win-x64
        run: dotnet publish src/DKRandomizeAIImagePromptGenerator.Wpf/DKRandomizeAIImagePromptGenerator.Wpf.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true --no-restore -o artifacts/win-x64

      - name: Smoke test WPF mouse wheel routing
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "artifacts/win-x64/DKRandomizeAIImagePromptGenerator.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--scroll-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "WPF mouse wheel routing smoke test failed. Exit code: $($process.ExitCode)"
          }

      - name: Smoke test published app startup
        shell: pwsh
        run: |
          $appData = Join-Path $env:LOCALAPPDATA "DK Randomize AI Image Prompt Generator"
          $log = Join-Path $appData "startup-crash.log"
          if (Test-Path $log) { Remove-Item $log -Force }

          $exe = Join-Path $PWD "artifacts/win-x64/DKRandomizeAIImagePromptGenerator.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5

          if (Test-Path $log) {
            Write-Host "WPF startup crash log:"
            Get-Content $log
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw "Published WPF application reported a startup crash."
          }

          if ($process.HasExited) {
            throw "Published WPF application exited during startup smoke test. Exit code: $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DK-Randomize-AI-Image-Prompt-Generator-WPF-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
